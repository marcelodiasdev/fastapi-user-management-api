[project]
name = "car-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Marcelo Dias",email = "marcelodevfront@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "fastapi-swagger-dark (>=0.0.9,<0.0.10)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)"
]
